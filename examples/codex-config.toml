# Example Codex MCP configuration for Aegis.
#
# Aegis Desktop auto-starts the Aegis Gateway widget by default.
# If the endpoint is unavailable, open Aegis and start the Aegis Gateway widget
# from Settings -> Widgets.

[mcp_servers.aegis]
url = "http://127.0.0.1:17321/mcp"
enabled_tools = [
  "list_hosts",
  "open_session",
  "close_session",
  "run_command",
  "tail_log",
  "get_terminal_snapshot",
  "get_policy",
  "update_policy",
  "file_list",
  "file_stat",
  "file_read",
  "file_write",
  "file_delete",
  "file_upload",
  "file_download",
]

# Aegis handles command risk, approval, and audit internally.
# Keep Codex-side tool approval lightweight for this local MCP server.
default_tools_approval_mode = "approve"
