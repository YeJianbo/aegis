[workspace]
resolver = "3"
members = [
  "crates/aegis-audit",
  "crates/aegis-gateway",
  "crates/aegis-mcp",
  "crates/aegis-policy",
]

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/your-org/aegis"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
